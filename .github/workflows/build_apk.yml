name: Build Release APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Setup google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "✅ Loaded google-services.json from GitHub secret."
          else
            echo '{"project_info":{"project_number":"100000000000","project_id":"kalasetu-53f92","storage_bucket":"kalasetu-53f92.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:100000000000:android:0000000000000000000000","android_client_info":{"package_name":"com.example.learningdart"}},"oauth_client":[],"api_key":[{"current_key":"dummy_api_key"}],"services":{"analytics_service":{"status":1}}}]}' > android/app/google-services.json
            echo "⚠️ Using fallback google-services.json structure for CI build."
          fi

      - name: Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: kalasetu-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

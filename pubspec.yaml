name: kalasetu_v2
description: "कलाSetu — AI-powered rural artisan marketplace by MoSJE | SIH2025"
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.7

  # Networking
  dio: ^5.4.3+1
  connectivity_plus: ^6.0.3

  # Storage
  shared_preferences: ^2.3.1
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.3

  # Firebase
  firebase_core: ^3.3.0
  firebase_messaging: ^15.1.0

  # UI / Design
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  cached_network_image: ^3.3.1
  cupertino_icons: ^1.0.8

  # Media
  image_picker: ^1.1.2
  record: ^7.1.1
  just_audio: ^0.9.40

  # Permissions
  permission_handler: ^11.3.1

  # Utilities
  intl: 0.20.2
  logger: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
